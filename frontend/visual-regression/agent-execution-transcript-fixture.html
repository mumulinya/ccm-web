<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CCM Agent Execution Transcript Fixture</title>
    <style>
      :root { --text-primary:#e7e9f3; --text-secondary:#a9aec0; --text-muted:#767d93; --border-color:#556079; --surface:#121623; --surface-subtle:#161a28; --primary-color:#5b8cff; }
      * { box-sizing: border-box; }
      body { margin:0; min-height:100vh; color:var(--text-primary); background:#0d1019; font-family:Inter,"Microsoft YaHei",sans-serif; }
      #app { width:min(920px,100%); margin:0 auto; padding:28px 18px; }
      .fixture-title { margin:0 0 18px; font-size:20px; }
      .message { margin-bottom:12px; padding:16px; border:1px solid #293044; border-radius:12px; background:#121623; }
      .answer { margin:10px 2px 0; white-space:pre-wrap; line-height:1.65; color:#d9dcec; }
      .composer-fixture { margin-bottom:12px; padding:80px 12px 10px; border:1px solid #293044; border-radius:12px; background:linear-gradient(180deg,#101420,#151a29); }
      .opened-file, .opened-batch { display:none; }
      @media (max-width:720px) { #app { padding:14px 10px; } .message { padding:10px; } }
    </style>
  </head>
  <body><div id="app"></div><script type="module" src="./agent-execution-transcript-fixture.js"></script></body>
</html>
