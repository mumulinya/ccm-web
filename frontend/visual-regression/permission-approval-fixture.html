<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>CCM Permission Approval Fixture</title>
    <style>
      :root{--text-primary:#172033;--text-secondary:#526076;--text-muted:#7a8799;--border-color:#d9e0ea;--bg-card:#fff;--bg-primary:#f7f9fc;--warning-soft:#fff7e6;--danger-soft:#fff0f0;--success-soft:#edf9f1;--accent-yellow:#b45309;--accent-red:#dc2626;--accent-green:#15803d}*{box-sizing:border-box}body{margin:0;background:var(--bg-primary);font-family:Inter,"Microsoft YaHei",sans-serif;color:var(--text-primary)}main{width:min(980px,100%);margin:0 auto;padding:70px 24px}.conversation{min-height:430px;padding:28px;border:1px solid var(--border-color);border-radius:14px;background:var(--bg-card)}.conversation-copy{display:grid;gap:10px;margin-bottom:110px;color:var(--text-secondary);font-size:14px}.composer{display:flex;align-items:center;gap:10px;margin:12px 16px 0;padding:9px 10px;border:1px solid var(--border-color);border-radius:10px;background:var(--bg-card)}.composer span{flex:1;color:var(--text-muted);font-size:12px}.composer button{height:34px;padding:0 18px;border:0;border-radius:7px;background:#2563eb;color:white;font-weight:700}.decision{display:none}[data-theme="dark"]{--text-primary:#eef2ff;--text-secondary:#bac3d6;--text-muted:#8590a5;--border-color:#354055;--bg-card:#111827;--bg-primary:#0b101a;--warning-soft:#36250e;--danger-soft:#3b171a;--success-soft:#123021}@media(max-width:560px){main{padding:20px 0}.conversation{min-height:100vh;padding:18px 0;border:0;border-radius:0}.conversation-copy{padding:0 14px;margin-bottom:70px}.composer{margin-inline:10px}}
    </style>
  </head>
  <body><div id="app"></div><script type="module" src="./permission-approval-fixture.js"></script></body>
</html>
