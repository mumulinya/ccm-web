<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>CCM Message Copy Fixture</title>
    <style>
      :root{--text-primary:#172033;--text-secondary:#526076;--text-muted:#7a8799;--border-color:#d9e0ea;--bg-primary:#f7f9fc;--panel-muted:#f1f5f9;--control-hover:#e9eef6;--accent-blue:#2563eb;--accent-green:#15803d;--accent-red:#dc2626}*{box-sizing:border-box}body{margin:0;background:var(--bg-primary);font-family:Inter,"Microsoft YaHei",sans-serif;color:var(--text-primary)}main{width:min(880px,100%);margin:0 auto;padding:70px 24px}.conversation{min-height:520px;display:flex;flex-direction:column;padding:28px;border:1px solid var(--border-color);border-radius:14px;background:#fff}.bubble{max-width:100%;padding:10px 13px;border-radius:10px;background:#2563eb;color:#fff;font-size:14px;line-height:1.55}.answer{font-size:14px;line-height:1.65}.conversation-message__avatar{background:#eef3ff}[data-theme="dark"]{--text-primary:#eef2ff;--text-secondary:#bac3d6;--text-muted:#8590a5;--border-color:#354055;--bg-primary:#0b101a;--panel-muted:#1a2130;--control-hover:#242d40}.fixture-toolbar{margin-bottom:24px}.fixture-toolbar button{padding:7px 10px;border:1px solid var(--border-color);border-radius:6px;background:transparent;color:var(--text-primary)}@media(max-width:560px){main{padding:0}.conversation{min-height:100vh;padding:22px 12px;border:0;border-radius:0}}
    </style>
  </head>
  <body><div id="app"></div><script type="module" src="./message-copy-fixture.js"></script></body>
</html>
