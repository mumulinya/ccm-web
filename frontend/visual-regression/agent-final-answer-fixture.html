<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>CCM Agent Final Answer Fixture</title>
    <style>
      :root{--text-primary:#172033;--text-secondary:#526076;--text-muted:#7a8799;--border-color:#d9e0ea;--border-strong:#9aa8bc;--bg-primary:#fff;--panel-muted:#f4f7fb;--control-hover:#eaf0f8;--accent-blue:#2563eb}*{box-sizing:border-box}body{margin:0;background:var(--bg-primary);font-family:Inter,"Microsoft YaHei",sans-serif;color:var(--text-primary)}main{width:min(920px,100%);margin:0 auto;padding:28px 22px 80px}.fixture-message{display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;margin-bottom:36px}.fixture-avatar{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;background:#eef3ff;color:#2563eb;font-weight:800}.fixture-answer{min-width:0}.fixture-toolbar{display:flex;gap:8px;margin-bottom:18px}.fixture-toolbar button{padding:7px 10px;border:1px solid var(--border-color);border-radius:6px;background:var(--bg-primary);color:var(--text-primary)}[data-theme="dark"]{--text-primary:#eef2ff;--text-secondary:#bac3d6;--text-muted:#8590a5;--border-color:#354055;--border-strong:#71809b;--bg-primary:#111621;--panel-muted:#1a2130;--control-hover:#242d40;--accent-blue:#79a4ff}@media(max-width:560px){main{padding:18px 12px 60px}.fixture-message{grid-template-columns:30px minmax(0,1fr)}.fixture-avatar{width:30px;height:30px}}
    </style>
  </head>
  <body><div id="app"></div><script type="module" src="./agent-final-answer-fixture.js"></script></body>
</html>
